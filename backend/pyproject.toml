[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datatrust-workbench-api"
version = "0.1.0"
description = "Deterministic data quality workbench API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mcp>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pandas-stubs>=2.2,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["pandas"]
ignore_missing_imports = true
